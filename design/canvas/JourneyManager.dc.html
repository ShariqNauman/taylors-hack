<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey: security manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F5F7}
a{color:#1E3A8A}a:hover{color:#142A66}
</style>
</helmet>
<div style="font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #0F1419; background: #F4F5F7; box-sizing: border-box; padding: 56px 24px 72px">
<div style="max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">

<header style="display: flex; flex-direction: column; gap: 20px">
<div style="font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6472">{{eyebrow}}</div>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 760px">
<h1 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 800">{{role}}</h1>
<p style="margin: 0; font-size: 21px; line-height: 1.45; color: #3A4350">{{job}}</p>
</div>
<span style="font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 6px; background: #EEF0F3; color: #0F1419">{{cadence}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #D9DDE3; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6472">{{f.k}}</div>
<div style="font-size: 15px; line-height: 1.4">{{f.v}}</div>
</div>
</sc-for>
</div>
</header>

<section aria-label="Workflow" style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-size: 28px; font-weight: 800">Workflow</h2>
<div style="display: flex; gap: 16px; font-size: 13px; color: #3A4350; flex-wrap: wrap">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border: 1px solid #0F1419; border-radius: 4px; background: #FFFFFF"></span>Step</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border: 1.5px dashed #1E3A8A; border-radius: 4px; background: #F4F7FD"></span>Decision</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px 8px">
<sc-for list="{{flow}}" as="s" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 8px">
<sc-if value="{{s.isStep}}" hint-placeholder-val="{{ true }}">
<div style="width: 196px; min-height: 132px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #0F1419; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; color: #5A6472">{{s.n}}</div>
<div style="font-size: 15px; line-height: 1.4; font-weight: 500; flex-grow: 1">{{s.t}}</div>
<span style="align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #EEF0F3; color: #3A4350">{{s.screen}}</span>
</div>
</sc-if>
<sc-if value="{{s.isDecision}}" hint-placeholder-val="{{ false }}">
<div style="width: 250px; min-height: 132px; box-sizing: border-box; background: #F4F7FD; border: 1.5px dashed #1E3A8A; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; color: #1E3A8A">
<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L22 12 L12 22 L2 12 Z" fill="none" stroke="#1E3A8A" stroke-width="2.5"></path></svg>{{s.n}}</div>
<div style="font-size: 15px; line-height: 1.35; font-weight: 800">{{s.q}}</div>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.35">
<div><span style="font-weight: 700">{{s.aLabel}} →</span> {{s.a}}</div>
<div><span style="font-weight: 700">{{s.bLabel}} →</span> {{s.b}}</div>
</div>
</div>
</sc-if>
<sc-if value="{{s.notLast}}" hint-placeholder-val="{{ true }}">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</sc-if>
</div>
</sc-for>
</div>
</section>

<section aria-label="Journey map" style="display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 28px; font-weight: 800">Journey map</h2>
<div style="overflow-x: auto; background: #FFFFFF; border: 1px solid #D9DDE3; border-radius: 10px">
<div style="min-width: 1240px">
<div style="display: grid; grid-template-columns: 150px repeat(6, minmax(0, 1fr)); border-bottom: 2px solid #0F1419">
<div style="padding: 16px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6472; align-self: end">Stage</div>
<sc-for list="{{stages}}" as="st" hint-placeholder-count="6">
<div style="padding: 16px 14px; border-left: 1px solid #D9DDE3; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; color: #5A6472">{{st.n}}</div>
<div style="font-size: 18px; font-weight: 800; line-height: 1.2">{{st.name}}</div>
</div>
</sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 150px repeat(6, minmax(0, 1fr)); border-bottom: 1px solid #D9DDE3; background: {{r.bg}}">
<div style="padding: 14px 16px; font-size: 14px; font-weight: 800">{{r.label}}</div>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="6">
<div style="padding: 14px; border-left: 1px solid #D9DDE3; font-size: 14px; line-height: 1.42; color: {{c.color}}; font-weight: {{r.weight}}">{{c.t}}</div>
</sc-for>
</div>
</sc-for>
<div style="display: grid; grid-template-columns: 150px repeat(6, minmax(0, 1fr))">
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 800">Stress</div>
<div style="font-size: 12px; color: #5A6472">1 low · 5 high</div>
</div>
<sc-for list="{{stress}}" as="x" hint-placeholder-count="6">
<div style="padding: 14px; border-left: 1px solid #D9DDE3; display: flex; align-items: flex-end; gap: 10px; height: 96px; box-sizing: border-box">
<div style="width: 28px; height: {{x.h}}; background: #0F1419; border-radius: 3px 3px 0 0"></div>
<div style="font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 14px; font-weight: 700">{{x.v}}</div>
</div>
</sc-for>
</div>
</div>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const D = {
      eyebrow: 'Journey 3 of 4 · Weekly · Security or site manager',
      role: 'Security or site manager',
      job: 'Turn last month’s incidents into this week’s roster, and keep every camera working.',
      cadence: 'WEEKLY · 10 MIN',
      facts: [
        { k: 'Where', v: 'Office desk, Monday morning' },
        { k: 'Constraint', v: 'Fixed headcount; a roster to fill' },
        { k: 'Device', v: 'Laptop browser' },
        { k: 'Screens', v: 'Plan first, then Incidents' },
        { k: 'Reports to', v: 'Head of security or facilities' },
        { k: 'Success', v: 'Avoided per patrol hour; no camera black for more than a day' }
      ],
      flow: [
        { t: 'Open Plan. Three patrol cards sit above the fold.', screen: 'Plan' },
        { t: 'Read slot 1: place, days, hours, count, avoided per week, assumption.', screen: 'Plan · card' },
        { q: 'Trust the slot?', aLabel: 'Check', a: 'show it on the heatmap and hotspot list', bLabel: 'Yes', b: 'add to the roster' },
        { t: 'Check camera health. One tile black for 3 days.', screen: 'Plan · cameras' },
        { q: 'Camera black over a day?', aLabel: 'Yes', a: 'send a repair request', bLabel: 'No', b: 'carry on' },
        { t: 'Open Incidents. Filter by status and camera; read labels collected.', screen: 'Incidents' },
        { q: 'One camera crying wolf?', aLabel: 'Yes', a: 'ask to retune that zone threshold', bLabel: 'No', b: 'leave it' },
        { t: 'Update the roster and send a three-line summary upward.', screen: 'Outside EarlyEye' }
      ],
      stages: ['Open Monday', 'Read the plan', 'Check the evidence', 'Fix cameras', 'Review labels', 'Act and report'],
      rows: [
        { label: 'Trigger', cells: ['Roster due', 'Plan regenerated for the week', 'A slot looks surprising', 'A tile says black for 3 days', 'Dismissals pile up on one camera', 'End of the review'] },
        { label: 'Doing', cells: ['Opens Plan on a laptop', 'Reads three slot cards', 'Clicks "Show on heatmap"; reads the hotspot list', 'Sends a repair request', 'Filters Incidents by status and camera', 'Updates the roster; writes a summary'] },
        { label: 'Sees', cells: ['Three cards first, heatmap below', '"Block C stairwell · Mon–Thu 13:00–14:00 · 5 in 4 weeks · ~3 avoided/week"', 'A 7 × 24 grid; outlined cells meet the hotspot rule', 'Corridor L5 black since Thu 02:00; slot 2 covers its floor', '"Labels collected", confirmed against dismissed', 'The assumption line, ready to quote'] },
        { label: 'Thinking', cells: ['Where do my spare people go?', 'Why there, why then?', 'Pattern, or one bad week?', 'How long has it been dark?', 'Is this camera crying wolf?', 'What do I tell my boss?'] },
        { label: 'Pain today', cells: ['Patrols follow habit, not data', 'Reports are counts with no recommendation', 'Cannot check the claim behind a number', 'Dead cameras found after an incident', 'No feedback on alert quality', 'Avoided incidents are invisible'], tone: 'pain' },
        { label: 'Design response', cells: ['Decision first: patrol cards above the fold', 'Each card names place, days, hours, count and avoided per week', 'Heatmap one click away; hotspot rule written on screen', 'Camera health on Live and Plan', 'Labels counted and filterable', 'Assumption printed beside every estimate'], tone: 'design' },
        { label: 'Measure', cells: ['Minutes to a roster decision', 'Slots adopted', '', 'Cameras black over a day', 'False alarms per camera-hour', 'Avoided per patrol hour, estimated'] }
      ],
      stress: [2, 2, 3, 3, 2, 3]
    };
    return this.build(D);
  }
  build(D) {
    const steps = D.flow.map((s, i) => {
      const isDecision = !!s.q;
      return Object.assign({}, s, {
        n: (isDecision ? 'D' : 'S') + String(i + 1).padStart(2, '0'),
        isStep: !isDecision,
        isDecision: isDecision,
        notLast: i < D.flow.length - 1
      });
    });
    const rows = D.rows.map((r) => ({
      label: r.label,
      bg: r.tone === 'design' ? '#F4F7FD' : (r.tone === 'pain' ? '#F4F5F7' : '#FFFFFF'),
      weight: r.tone === 'design' ? '700' : '400',
      cells: r.cells.map((t) => ({ t: t || '—', color: t ? (r.tone === 'design' ? '#1E3A8A' : '#0F1419') : '#B8BFC9' }))
    }));
    return {
      eyebrow: D.eyebrow, role: D.role, job: D.job, cadence: D.cadence, facts: D.facts,
      flow: steps,
      stages: D.stages.map((name, i) => ({ name: name, n: String(i + 1).padStart(2, '0') })),
      rows: rows,
      stress: D.stress.map((v) => ({ v: v, h: (v * 13) + 'px' }))
    };
  }
}
</script>
</body>
</html>
