# render.yaml — Render Blueprint for EarlyEye API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: earlyeye-api
    runtime: python
    repo: https://github.com/ShariqNauman/taylors-hack
    branch: backend
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false           # set manually in Render dashboard
      - key: SUPABASE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false           # set manually; without it /handover and /agent fall back
      - key: ANTHROPIC_MODEL
        value: "claude-sonnet-5-5"
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /health
    plan: free
